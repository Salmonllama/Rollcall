# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  dotnet:
    name: .NET build, test, format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore src/Rollcall.sln
      - run: dotnet build src/Rollcall.sln --no-restore -c Release
      - run: dotnet test src/Rollcall.sln --no-build -c Release
      - run: dotnet format src/Rollcall.sln --no-restore --verify-no-changes

  web:
    name: Web lint, test, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  licenses:
    name: License compliance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: dotnet restore src/Rollcall.sln
      - name: NuGet packages
        run: scripts/check-nuget-licenses.sh
      - run: npm ci
        working-directory: web
      - name: npm packages
        run: node scripts/check-npm-licenses.mjs

  headers:
    name: License headers and shell lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: SPDX headers and LICENSE text
        run: scripts/check-spdx-headers.sh
      - name: shellcheck
        run: |
          mapfile -t scripts < <(git ls-files '*.sh' '*.bash')
          shellcheck "${scripts[@]}"

  images:
    name: Container images
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [Api, Worker]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image }} image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Rollcall.${{ matrix.image }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-dco.sh "$BASE" "$HEAD"

  ci-passed:
    name: CI passed
    if: always()
    needs: [dotnet, web, licenses, headers, images, dco]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job to succeed (DCO may be skipped on pushes)
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then
            echo "✕ One or more CI jobs failed."
            exit 1
          fi
          echo "✓ All CI jobs passed."
